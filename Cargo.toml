[package]
name = "dln-e2e-test"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
tonic = "0.9"
prost = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Nostr NCC/NWC client
nostr-sdk = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2" }
nwc = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2" }
toml = "0.8"

# Docker containers
testcontainers = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
tonic-build = "0.9"
